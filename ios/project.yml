# XcodeGen spec — the source of truth for the Xcode project (the .xcodeproj is generated, gitignored).
#   cd ios && xcodegen generate && open BOBCapture.xcodeproj
# Signing: put DEVELOPMENT_TEAM (and optionally BOB_BUNDLE_PREFIX) in ios/Signing.local.xcconfig.
name: BOBCapture
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  BOBCapture:
    type: application
    platform: iOS
    sources: [BOBCapture]
    info:
      path: BOBCapture/Info.plist
      properties:
        CFBundleDisplayName: BOB Capture
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: BOB records camera frames and ARKit pose for rover safety inspection.
        NSLocalNetworkUsageDescription: BOB streams frames to the rover computer on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true            # recordings visible in Files / Finder
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arkit]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]  # UI only; device orientation is still reported
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BOB_BUNDLE_PREFIX).capture
        TARGETED_DEVICE_FAMILY: "1"
  BOBCaptureTests:
    # Logic tests (no host app): the wire contract only, so they run on the Simulator.
    type: bundle.unit-test
    platform: iOS
    sources:
      - BOBCaptureTests
      - BOBCapture/Wire
      - path: ../tests/fixtures      # shared with Python: Swift must decode the same messages
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BOB_BUNDLE_PREFIX).capture.tests
schemes:
  BOBCapture:
    build:
      targets:
        BOBCapture: all
        BOBCaptureTests: [test]
    test:
      targets: [BOBCaptureTests]
