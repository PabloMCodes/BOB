# Step 3d walkway-obstruction evidence filters (vision/walkway.py WalkwayConfig).
# Demo defaults for a fixed tripod phone, NOT lighting calibration or validated accuracy thresholds.
walkway_version: 1
blur_kernel_px: 5               # odd; smooths sensor noise before comparing with the reference
morph_kernel_px: 5              # odd; removes speckle / fills small holes in the change mask
change_threshold: 28.0          # OpenCV 8-bit LAB distance counted as "changed"
min_change_area_px: 150         # smaller changed blobs are ignored
edge_margin_px: 4               # drawn walkway edges are uncertain; excluded from assessment
min_clear_width_fraction: 0.3   # lane check (later step): clear lane width / walkway width
check_max_side_px: 480          # camera check runs on a downscaled copy
min_background_fraction: 0.1    # need this much image outside the walkway to check the camera
max_camera_shift_px: 4.0        # larger shift vs reference -> unverified camera_moved
max_brightness_change: 20.0     
max_background_change_fraction: 0.2  # more changed background -> unverified background_changed
